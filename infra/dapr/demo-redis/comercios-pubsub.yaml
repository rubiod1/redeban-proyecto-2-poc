apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: comercios-pubsub
  namespace: comercios
scopes:
  - comercios-api
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis.messaging.svc.cluster.local:6379"
    - name: redisPassword
      value: ""
