apiVersion: v1
kind: Service
metadata:
  name: apicurio
  namespace: registry
spec:
  selector: {app: apicurio}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels: {app: apicurio}
  template:
    metadata:
      labels: {app: apicurio}
    spec:
      containers:
        - name: apicurio
          image: quay.io/apicurio/apicurio-registry:3.0.7
          ports:
            - containerPort: 8080
          env:
            - {name: APICURIO_STORAGE_KIND, value: "sql"}
            - {name: APICURIO_STORAGE_SQL_KIND, value: "h2"}
            - {name: APICURIO_DATASOURCE_URL, value: "jdbc:h2:mem:apicurio;DB_CLOSE_DELAY=-1"}
